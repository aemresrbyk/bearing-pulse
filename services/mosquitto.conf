# Each listener has its own auth rules.
per_listener_settings true

# 1883: localhost only, no auth. Only processes on this laptop (the bridge) can reach it.
listener 1883 127.0.0.1
allow_anonymous true

# 8883: the port sensor nodes use over the network. TLS + username/password (Phase 5).
# Needs scripts/make_certs.sh first. Paths are relative to the repo root (stack.sh runs from there).
listener 8883 0.0.0.0
allow_anonymous false
password_file .local/certs/passwd
cafile .local/certs/ca.crt
certfile .local/certs/server.crt
keyfile .local/certs/server.key
